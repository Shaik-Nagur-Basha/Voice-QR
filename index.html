<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
  />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Voice-to-QR Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mobile-shell">
    <!-- Top Header Bar: Inline Format Code, Theme Switch, Format Rule Toggle, Scanner Button -->
    <header class="top-bar">
      <div class="top-controls-inline">
        <div id="topFormatBox" class="format-box" title="Default Format Code">
          <div class="format-box-left">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="7" cy="7" r="1.5" fill="currentColor"></circle>
            </svg>
            <label for="topFormatInput" class="format-label">PREFIX</label>
          </div>
          <input
            id="topFormatInput"
            class="format-input"
            type="text"
            value="MRTN"
            maxlength="16"
            aria-label="Format Code"
          />
        </div>

        <!-- Theme Switch Button -->
        <button
          type="button"
          id="themeToggleBtn"
          class="btn-icon"
          title="Switch Theme (Auto / Dark / Light)"
          aria-label="Switch Theme"
        >
          <span id="themeIconHolder" style="display:flex;align-items:center;justify-content:center;"></span>
        </button>

        <!-- Format Rules Mode Toggle Button -->
        <button
          type="button"
          id="formatModeToggleBtn"
          class="btn-icon active-rule"
          title="Format Rules Mode (ON: MRTN Rules / OFF: Exact Speech)"
          aria-label="Toggle Format Rules vs Exact Speech"
        >
          <span id="ruleIconHolder" style="display:flex;align-items:center;justify-content:center;"></span>
          <span class="rule-dot"></span>
        </button>

        <!-- Scanner Icon Button -->
        <button
          type="button"
          id="scannerBtn"
          class="btn-icon"
          title="Scan QR or Barcode"
          aria-label="Scan QR or Barcode"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Centered Mobile Stage: Square QR Code + Code Navigation/Edit/Copy + Transcript -->
    <main class="main-stage">
      <section class="qr-card" aria-label="Centered Square QR Code">
        <!-- Live Listener Status Pill Badge (above QR) -->
        <div id="statusBadge" class="status-badge ready">
          <span class="status-dot"></span>
          <span id="statusText">READY</span>
        </div>

        <!-- Centered Square QR Frame -->
        <div class="qr-stage-row">
          <div class="qr-square-wrapper">
            <canvas id="qrCanvas" width="280" height="280"></canvas>
          </div>
        </div>

        <!-- Code Readout Bar with Prev, Click-to-Edit, Copy, and Next -->
        <div class="code-readout">
          <div class="code-nav-row">
            <!-- Navigate Previous Button (Only appears when previous items exist) -->
            <button
              type="button"
              id="prevCodeBtn"
              class="code-nav-btn"
              title="Previous code"
              aria-label="Previous Code"
              style="display: none;"
            >
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>

            <!-- Code Display & Live Edit Container (click anywhere to start editing from click point) -->
            <div id="codeBoxWrapper" class="code-box-wrapper" title="Click anywhere on code to edit">
              <div id="formattedCodeDisplay" class="code-readout-value">MRTN-E-1-F-2-FRONT</div>
              <input
                id="liveEditInput"
                class="live-edit-input hidden"
                type="text"
                value="MRTN-E-1-F-2-FRONT"
                aria-label="Edit QR Code Text"
              />
            </div>

            <!-- Copy Code Icon Button (Right side to code) -->
            <button
              type="button"
              id="copyCodeBtn"
              class="code-action-btn"
              title="Copy code"
              aria-label="Copy code"
            >
              <svg id="copyIconSvg" viewBox="0 0 24 24" fill="none">
                <rect width="13" height="13" x="8.5" y="8.5" rx="2.5" stroke="currentColor" stroke-width="2"></rect>
                <path d="M5 15.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>

            <!-- Navigate Forward Button (Only appears when forward items exist) -->
            <button
              type="button"
              id="nextCodeBtn"
              class="code-nav-btn"
              title="Forward code"
              aria-label="Forward Code"
              style="display: none;"
            >
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>

          <div class="code-readout-footer">
            <div id="spokenTranscriptDisplay" class="spoken-transcript">
              Last command: "E 1 F 2 front"
            </div>
            <div id="historyIndicator" class="history-indicator">1 / 1</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Action Stage: Tactile 72x72px Studio Receiver Button -->
    <footer class="bottom-stage">
      <div id="micWrapper" class="mic-button-wrapper">
        <!-- Concentric ripple radar ring -->
        <div class="mic-ring"></div>
        <button id="voiceToggleBtn" class="mic-btn" aria-label="Start Voice Listening" title="Tap to Speak">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
            <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
      <div id="voiceHint" class="voice-hint">TAP TO SPEAK</div>
    </footer>
  </div>

  <!-- QR & Barcode Scanner Modal -->
  <div id="scannerModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="scannerModalTitle">
    <div class="modal-box">
      <div class="modal-title" id="scannerModalTitle">Scan QR or Barcode</div>
      <p class="modal-desc">
        Point your camera at any QR code or barcode. Scanning stops automatically upon read.
      </p>
      <div class="scanner-video-box">
        <video id="scannerVideo" playsinline muted></video>
        <div class="scan-laser"></div>
      </div>
      <div class="scan-fallback-row">
        <input
          id="barcodeWedgeInput"
          class="scan-fallback-input"
          type="text"
          placeholder="Or scan/paste barcode"
          aria-label="Barcode or QR text input"
        />
        <button type="button" id="applyScannedTextBtn" class="btn-primary-sm">Read</button>
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button type="button" id="closeScannerModalBtn" class="btn-secondary-sm" style="width:100%;">Stop &amp; Close Scanner</button>
      </div>
    </div>
  </div>

  <div id="toastMsg" class="toast" role="status" aria-live="polite"></div>

  <!-- External Connected Scripts -->
  <script src="app.js"></script>
</body>
</html>
